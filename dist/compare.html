<!doctype html><html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10161d"><meta name="description" content="同一份油藏网格，左右比较体渲染和表皮渲染，独立筛选、剖切和网格线控制。"><title>体积 / 表皮对比 · Reservoir Lab</title><link rel="icon" href="./icon.svg" type="image/svg+xml"><script src="./theme.js"></script><link rel="stylesheet" href="./compare.css"></head><body>
<header class="compare-header"><div class="identity"><img src="./icon.svg" alt="" width="30" height="30"><div><h1>体积 / 表皮对比</h1><span id="dataset-label">同一份网格 · 独立显示设置</span></div></div><div class="header-actions"><a id="single-view" href="./">单视图</a><button id="theme-toggle" type="button"><span class="theme-icon" aria-hidden="true">☀</span><span class="theme-label">浅色</span></button></div></header>
<div class="data-bar" aria-label="共享数据和视角"><label>数据 <select id="model-scale"><option value="explicit-1m">1M · 显式网格</option><option value="explicit-10m" selected>10M · 显式网格</option><option value="explicit-20m">20M · 显式网格</option></select></label><button id="open-import" type="button">导入 RESQML</button><label class="inline-check"><input id="sync-camera" type="checkbox" checked>同步视角</label><span class="bar-spacer"></span><span id="shared-memory">网格只加载一次</span><span id="engine-status">WebGL2</span><a id="engine-switch" href="?backend=webgpu">试用 WebGPU</a></div>
<p class="load-message" id="load-message" role="status">正在准备共享数据…</p>
<main id="comparison" class="comparison" aria-label="左右渲染对比"><canvas id="shared-canvas" aria-hidden="true"></canvas></main>
<dialog id="import-dialog"><form method="dialog" class="dialog-heading"><h2>加载同一份 RESQML</h2><button aria-label="关闭导入窗口">关闭</button></form><p class="muted">同时选择一个 EPC 及它引用的 HDF5 文件。本机解析后，两侧共用数据。</p><label for="resqml-files">选择文件</label><input id="resqml-files" type="file" accept=".epc,.h5,.hdf5,.hdf" multiple><p id="import-status" role="status">支持 RESQML 2.0 / 2.0.1 的 IJK 网格。</p><div id="import-options" hidden><div class="import-grid"><label>网格<select id="import-grid"></select></label><label>孔隙度<select id="import-phi"></select></label><label>孔隙度单位<select id="import-phi-unit"><option value="auto">使用文件单位</option><option value="fraction">小数 · 0–1</option><option value="percent">百分数 · 0–100</option></select></label><label>含油饱和度<select id="import-so"></select></label><label>渗透率<select id="import-k"></select></label><label>活动单元<select id="import-active"></select></label><label>活动标志<select id="import-active-mode"><option value="positive">正数为活动</option><option value="zero">0 为活动</option></select></label></div><button id="import-render" class="primary" type="button">加载到两侧</button></div><button id="import-cancel" type="button" hidden>取消解析</button></dialog>
<script type="module" src="./compare-app.js"></script></body></html>
